---
name: Pytest

"on":
  pull_request: null
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: >-
            venv-${{ matrix.python-version }}-${{
            hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: uv sync --python ${{ matrix.python-version }} --group dev

      # The fast suite only
      # The slow marker (serial GP fits, MAST reads over S3) is deselected by pyproject addopts
      # The C-Mod tests skip themselves without MDSplus tree access, 
      # the cluster tests without an authenticated ssh session
      - name: Fast tests
        run: uv run pytest
        timeout-minutes: 15

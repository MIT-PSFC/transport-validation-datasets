repos:
  - repo: local
    hooks:
      # https://zhauniarovich.com/post/2020/2020-06-clearing-jupyter-output/
      - id: jupyter-nb-clear-output
        name: jupyter-nb-clear-output
        files: \.ipynb$
        stages: [pre-commit]
        language: system
        entry: jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
      - id: ruff_format
        name: ruff_format 
        entry: uv run ruff format
        language: system
        types: [python]
        files: "^transport_validation_datasets/"
      - id: ruff_check
        name: ruff_check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: "^transport_validation_datasets/"
        exclude: "^transport_validation_datasets/tests/"
      # ruff's D/DOC rules cover docstring layout, but not whether the names under
      # Args: match the signature. pylint's docparams extension does.
      - id: docparams
        name: docparams
        entry: >-
          uv run pylint --load-plugins=pylint.extensions.docparams
          --disable=all
          --enable=missing-param-doc,differing-param-doc,useless-param-doc
          --accept-no-param-doc=n --default-docstring-type=google
        language: system
        types: [python]
        files: "^transport_validation_datasets/"
        exclude: "^transport_validation_datasets/tests/"
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        files: "^transport_validation_datasets/"
[project]
name = "transport-validation-datasets"
version = "0.1.0"
description = "Methods for generating datasets to validate transport codes and train hybrid physics models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dask>=2026",
    "disruption-py>=0.14.0",
    "fire>=0.7.1",
    "freeqdsk>=0.5.2",
    "matplotlib>=3.11.1",
    "mkgp==3.1.4",
    "numpy>=1.26",
    "s3fs>=2026.7.0",
    "scipy>=1.14",
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.6",
    "yamllint>=1.38.0",
]

[tool.isort]
profile = "black"

[tool.ruff.lint]
# preview is required for the DOC (pydoclint) rules. It also widens ruff's default
# rule set, so select is pinned explicitly: the E/F entries are ruff's own defaults.
preview = true
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "D",   # pydocstyle: docstring layout
    "DOC", # pydoclint: docstring content matches the code
]
ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D105", # missing docstring in magic method
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"transport_validation_datasets/tests/*" = ["D", "DOC"]

[tool.pytest.ini_options]
testpaths = ["transport_validation_datasets/tests"]
markers = [
    "slow: deselected by default, run with -m slow",
]
addopts = "-m 'not slow'"
filterwarnings = [
    "ignore::RuntimeWarning:disruption_py.*",
    "ignore::FutureWarning:disruption_py.*",
    # fork() in a multi-threaded process, from disruption_py spawning workers
    "ignore:This process:DeprecationWarning:multiprocessing.*",
    # inf - inf inside scipy's interp1d slope calculation, reached through
    # disruption_py's interp1: some intermediate disruption-py signal
    # derivations produce transient infs. The existing disruption_py ignore
    # above cannot catch this one because numpy floating-point warnings carry
    # scipy's module, not the caller's. Should be benign, don't spam test output.
    "ignore:invalid value encountered in subtract:RuntimeWarning:scipy.interpolate",
    # consolidated=True everywhere is deliberate (fast opens on many-file stores)
    # the spec caveat only matters to non-zarr-python readers.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification:UserWarning",
]

[tool.hatch.build.targets.sdist]
include = ["transport_validation_datasets"]

[tool.hatch.build.targets.wheel]
include = ["transport_validation_datasets"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
